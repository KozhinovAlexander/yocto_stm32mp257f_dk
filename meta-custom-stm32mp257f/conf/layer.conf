# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom-stm32mp257f"
BBFILE_PATTERN_meta-custom-stm32mp257f = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom-stm32mp257f = "6"

# This layer depends on the ST BSP layer and core
LAYERDEPENDS_meta-custom-stm32mp257f = "core stm-st-stm32mp"

# Compatible with Yocto Scarthgap (5.0)
LAYERSERIES_COMPAT_meta-custom-stm32mp257f = "scarthgap"
